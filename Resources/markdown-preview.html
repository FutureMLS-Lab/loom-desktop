<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  :root {
    /* Lets WebKit paint the pre-load page and scrollbars for the
       appearance we are about to style, instead of flashing white. */
    color-scheme: light dark;
    --bg: #fffdf7;
    --ink: #1f1a14;
    --muted: #6b6358;
    --rule: #e7e0d2;
    --code-bg: #f4efe3;
    --accent: #4f46e5;
    --quote: #8a7f6a;
    --hit: #fde68a;
    --hit-current: #f59e0b;
    --hit-current-ink: #1f1a14;
  }
  /* The palette's dark side — same warm cast as LoomColors' dark
     surfaces, keep the two in step. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #211f1a;
      --ink: #e7e1d5;
      --muted: #a49b8c;
      --rule: #3d392f;
      --code-bg: #2c2922;
      --accent: #8f8cf4;
      --quote: #9d937f;
      --hit: #6b5514;
      --hit-current: #f59e0b;
      --hit-current-ink: #1f1a14;
    }
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    /* PingFang named after the Latin faces, not before them: the system font
       has no CJK glyphs, and leaving the fallback implicit let the two
       scripts pair differently depending on what else was installed. */
    font: 16px/1.65 -apple-system, "SF Pro Text", "Helvetica Neue",
          "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
    /* A worktree path or a URL is one long word to the layout engine. Without
       this it runs past the right edge instead of folding. */
    overflow-wrap: break-word;
  }
  #wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 36px 64px;
  }
  #content > :first-child { margin-top: 0; }
  h1, h2, h3, h4, h5, h6 {
    line-height: 1.35;
    font-weight: 650;
    letter-spacing: -0.015em;
    margin: 1.6em 0 0.55em;
    /* Spread a two-line heading evenly rather than leaving one word alone on
       the second line. Ignored where unsupported. */
    text-wrap: balance;
  }
  h1 { font-size: 1.85em; border-bottom: 1px solid var(--rule); padding-bottom: 0.35em; }
  h2 { font-size: 1.4em; border-bottom: 1px solid var(--rule); padding-bottom: 0.25em; }
  h3 { font-size: 1.15em; }
  h4, h5, h6 { font-size: 1em; }
  p, ul, ol, blockquote, pre, table { margin: 0.85em 0; }
  ul, ol { padding-left: 1.4em; }
  li { margin: 0.25em 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.9em;
    background: var(--code-bg);
    padding: 0.12em 0.4em;
    border-radius: 4px;
    /* A path has no spaces to break at, so it needs permission to break
       anywhere — otherwise it decides the width of the whole document. */
    overflow-wrap: anywhere;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    line-height: 1.5;
  }
  pre code { background: none; padding: 0; font-size: 0.86em; }
  blockquote {
    margin-left: 0;
    padding: 0.2em 0 0.2em 1em;
    border-left: 3px solid var(--rule);
    color: var(--quote);
  }
  hr {
    border: 0; border-top: 1px solid var(--rule);
    margin: 2em 0;
  }
  /* Sized to its contents and scrolled when that is too wide, rather than
     stretched to the column and squeezed when it does not fit. These
     documents compare numbers; a results table crushed to fit is unreadable,
     and the digest under the terminal is narrow. */
  table {
    display: block;
    width: max-content;
    max-width: 100%;
    overflow-x: auto;
    border-collapse: collapse;
    font-size: 0.95em;
  }
  th, td {
    border: 1px solid var(--rule);
    padding: 0.45em 0.7em;
    text-align: left;
    /* Same-width digits, so a column of measurements lines up on the decimal
       point instead of drifting. */
    font-variant-numeric: tabular-nums;
  }
  th { background: var(--code-bg); }
  img { max-width: 100%; }
  /* Diagrams at their own size, scrolled sideways when wider than the
     column — the rule tables follow, for the same reason: a flowchart
     shrunk to fit has labels nobody can read. */
  .loom-diagram { margin: 0.85em 0; overflow-x: auto; }
  .loom-diagram svg { display: block; margin: 0 auto; max-width: none; }
  .loom-diagram.drawing { color: var(--muted); font-size: 0.9em; }
  .diagram-error { color: var(--muted); font-size: 0.85em; margin: -0.4em 0 0.85em; }
  #empty {
    color: var(--muted);
    text-align: center;
    padding: 80px 20px;
    font-size: 15px;
  }
  /* Digest under the terminal: same document, less room. */
  /* Leading stays generous even here. Chinese sets a solid block of glyphs
     with no ascenders or descenders to open the line up, so the 1.55 that
     reads fine in English closed up into a wall. */
  body.compact { font-size: 14px; line-height: 1.72; }
  body.compact #wrap { max-width: none; padding: 12px 26px 30px; }
  body.compact h1 { font-size: 1.5em; }
  body.compact h2 { font-size: 1.22em; }
  body.compact h3 { font-size: 1.05em; }
  body.compact h1, body.compact h2,
  body.compact h3, body.compact h4 { margin: 1.1em 0 0.4em; }
  body.compact p, body.compact ul, body.compact ol,
  body.compact blockquote, body.compact pre { margin: 0.6em 0; }
  body.compact pre { padding: 10px 12px; }
  body.compact #empty { padding: 34px 20px; font-size: 13px; }
  /* Laid out as part of a page: no scrollbar of its own, and no
     bottom padding reserved for one. */
  body.autosize { overflow: hidden; }
  body.autosize #wrap { padding-bottom: 18px; }
  /* Find. Sits over the text rather than above it, so showing it
     never reflows the document you are reading. */
  #find {
    position: fixed; top: 8px; right: 14px; display: none;
    align-items: center; gap: 6px; z-index: 20;
    background: var(--bg); border: 1px solid var(--rule);
    border-radius: 7px; padding: 4px 6px;
    box-shadow: 0 4px 14px rgba(31, 26, 20, 0.13);
    font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #find.on { display: flex; }
  #find input {
    border: 0; outline: 0; background: transparent; width: 150px;
    font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
  }
  #find button {
    border: 0; background: transparent; cursor: pointer;
    color: var(--muted); padding: 1px 4px; border-radius: 4px;
    font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #find button:hover { background: var(--code-bg); color: var(--ink); }
  #findCount { color: var(--muted); min-width: 34px; text-align: right; }
  mark.loom-hit { background: var(--hit); color: inherit; padding: 0; }
  mark.loom-hit.current { background: var(--hit-current); color: var(--hit-current-ink); }
  /* Fold controls are part of the rendered document, leaving heading text
     selectable and its links usable. No animation or height-measure loop. */
  #reading-tools {
    display: flex; align-items: center; gap: 4px;
    margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule);
    color: var(--muted); font-size: 11px; line-height: 1.4;
  }
  #reading-tools[hidden] { display: none; }
  #reading-tools span { flex: 1; }
  #reading-tools button {
    font: inherit; color: var(--muted); background: transparent; border: 0;
    border-radius: 5px; padding: 5px 7px; cursor: pointer;
  }
  #reading-tools button:hover { background: var(--code-bg); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .loom-section { display: flow-root; }
  .loom-section > :is(h1,h2,h3,h4,h5,h6) { position: relative; }
  #content > .loom-section:first-child > :first-child { margin-top: 0; }
  .section-body[hidden] { display: none; }
  .fold-toggle {
    position: absolute; right: calc(100% + 3px); top: 0.12em;
    width: 20px; height: 24px; padding: 0; border: 0; border-radius: 4px;
    background: transparent; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .fold-toggle::before {
    content: ''; width: 5px; height: 5px; border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg);
  }
  .fold-toggle[aria-expanded="false"]::before { transform: rotate(-45deg); }
  .fold-toggle:hover { color: var(--accent); background: var(--code-bg); }
  .loom-section.collapsed > :first-child { color: var(--muted); margin-top: 0.8em; margin-bottom: 0.35em; }
</style>
</head>
<body>
  <div id="find">
    <input id="findInput" type="text" placeholder="Find" spellcheck="false"/>
    <span id="findCount"></span>
    <button id="findPrev" title="Previous (⇧⌘G)">‹</button>
    <button id="findNext" title="Next (⌘G)">›</button>
    <button id="findDone" title="Done (esc)">Done</button>
  </div>
  <div id="wrap">
    <nav id="reading-tools" aria-label="Document sections" hidden>
      <span>Sections</span>
      <button id="fold-all" type="button">Collapse all</button>
      <button id="unfold-all" type="button">Expand all</button>
    </nav>
    <div id="content"><div id="empty">Nothing to preview</div></div>
  </div>
  <!--marked-->
  <!--purify-->
  <script>
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, function(c) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
      });
    }
    window.__loomSetCompact = function(on) {
      document.body.classList.toggle('compact', !!on);
      reportHeight();
    };
    var autosize = false;
    window.__loomAutosize = function (on) {
      autosize = !!on;
      document.body.classList.toggle('autosize', autosize);
      reportHeight();
    };
    var heightFrame = 0;
    function reportHeight() {
      if (!autosize || heightFrame) return;
      // Measure after layout settles, or the first reading is of a
      // half-built document.
      heightFrame = requestAnimationFrame(function () {
        heightFrame = 0;
        // The content's own box, not the document's: scrollHeight is
        // floored at the viewport, so once the view had been sized to
        // a long plan it could never report a shorter one again.
        var wrap = document.getElementById('wrap');
        var h = wrap
          ? Math.ceil(wrap.getBoundingClientRect().height)
          : document.documentElement.scrollHeight;
        try { window.webkit.messageHandlers.preview.postMessage(h); } catch (e) {}
      });
    }
    window.addEventListener('resize', reportHeight);
    // The document also grows after it is measured: a figure arrives, a
    // <details> opens. Sized once, the view clipped whatever came after.
    if (window.ResizeObserver) {
      new ResizeObserver(function () { reportHeight(); }).observe(document.getElementById('wrap'));
    }

    var foldDocument = '', collapsedKeys = new Set(), sections = [];
    function postFolds() {
      try {
        window.webkit.messageHandlers.preview.postMessage({
          type: 'folds', document: foldDocument, collapsed: Array.from(collapsedKeys)
        });
      } catch (e) {}
      reportHeight();
    }
    function setFold(section, collapsed) {
      var key = section.dataset.foldKey;
      var button = section.firstElementChild.querySelector('.fold-toggle');
      section.classList.toggle('collapsed', collapsed);
      section.lastElementChild.hidden = collapsed;
      button.setAttribute('aria-expanded', String(!collapsed));
      button.setAttribute('aria-label', (collapsed ? 'Expand ' : 'Collapse ') + section.dataset.title);
      button.title = (collapsed ? 'Expand section' : 'Collapse section') + ' · Option-click includes subsections';
      if (collapsed) collapsedKeys.add(key); else collapsedKeys.delete(key);
    }
    function buildSections() {
      var root = document.getElementById('content');
      var nodes = Array.from(root.childNodes), stack = [], counts = new Map();
      sections = [];
      nodes.forEach(function (node) {
        var heading = node.nodeType === 1 && /^H[1-6]$/.test(node.tagName);
        if (heading) {
          var level = Number(node.tagName.slice(1));
          while (stack.length && stack[stack.length - 1].level >= level) stack.pop();
          var parent = stack.length ? stack[stack.length - 1] : null;
          var title = node.textContent.trim();
          node.setAttribute('aria-label', title);
          var path = (parent ? parent.key : '') + '/' + level + ':' + encodeURIComponent(title);
          var occurrence = (counts.get(path) || 0) + 1;
          counts.set(path, occurrence);
          var key = path + ':' + occurrence;
          var section = document.createElement('section');
          section.className = 'loom-section';
          section.dataset.foldKey = key;
          section.dataset.title = title;
          var body = document.createElement('div');
          body.className = 'section-body';
          body.id = 'loom-section-body-' + sections.length;
          var toggle = document.createElement('button');
          toggle.type = 'button'; toggle.className = 'fold-toggle';
          toggle.setAttribute('aria-controls', body.id);
          node.prepend(toggle);
          section.append(node, body);
          (parent ? parent.body : root).append(section);
          sections.push(section);
          stack.push({ level: level, key: key, body: body });
          setFold(section, collapsedKeys.has(key));
        } else if (stack.length) {
          stack[stack.length - 1].body.append(node);
        }
      });
      var current = new Set(sections.map(function (s) { return s.dataset.foldKey; }));
      collapsedKeys = new Set(Array.from(collapsedKeys).filter(function (key) { return current.has(key); }));
      document.getElementById('reading-tools').hidden = sections.length === 0;
    }
    document.addEventListener('click', function (event) {
      var toggle = event.target.closest('.fold-toggle');
      if (toggle) {
        var section = toggle.closest('.loom-section');
        var collapse = toggle.getAttribute('aria-expanded') === 'true';
        setFold(section, collapse);
        if (event.altKey) section.querySelectorAll('.loom-section').forEach(function (child) { setFold(child, collapse); });
        postFolds();
      } else if (event.target.id === 'fold-all' || event.target.id === 'unfold-all') {
        var collapse = event.target.id === 'fold-all';
        // Keep a sole document-title container open so Collapse all exposes
        // its chapter headings, rather than hiding the entire plan.
        var roots = document.querySelectorAll('#content > .loom-section');
        sections.forEach(function (section) {
          var title = roots.length === 1 && section === roots[0] && section.querySelector('.loom-section');
          setFold(section, collapse && !title);
        });
        postFolds();
      }
    });
    function revealSection(node) {
      var section = node.closest('.loom-section'), changed = false;
      while (section) {
        if (section.classList.contains('collapsed')) { setFold(section, false); changed = true; }
        section = section.parentElement.closest('.loom-section');
      }
      if (changed) postFolds();
    }

    // Figures. A relative path in the document means "next to this
    // file on the server", which the page cannot read for itself, so
    // it is pointed at our own scheme and fetched with the token.
    //
    // WebKit keeps anything loaded from a scheme of its host for as long
    // as the page lives, and asks for a URL again only after a failure.
    // So each fetch carries a version: a render or a refresh asks for
    // every figure afresh, because agents regenerate figures in place,
    // while the copy already on screen stays up until its replacement
    // has arrived. A figure that is missing, or caught mid-write, is
    // tried again instead of being left broken until the text changes.
    var assetProject = '', assetTask = '', assetDir = '';
    var assetShown = Object.create(null);
    var assetWanted = Object.create(null);
    var assetRetry = Object.create(null);
    var assetSerial = 0;
    var ASSET_RETRY_MS = [1500, 4000, 10000, 30000];
    window.__loomAssetScope = function (project, task, dir) {
      assetProject = project || '';
      assetTask = task || '';
      assetDir = dir || '';
      linkAssets(false);
    };
    window.__loomRefreshAssets = function () { linkAssets(true); };
    // Relative to the document's own folder, as every markdown viewer
    // reads it. marked percent-encodes the source — a figure named
    // 图 1.png reaches the page as %E5%9B%BE%201.png — and the server
    // looks for the file by its name.
    function assetPath(raw) {
      var path = raw.split(/[?#]/)[0];
      try { path = decodeURI(path); } catch (e) {}
      var absolute = path.charAt(0) === '/';
      if (!absolute && assetDir) path = assetDir + '/' + path;
      var parts = [];
      path.split('/').forEach(function (part) {
        if (!part || part === '.') return;
        if (part === '..' && parts.length && parts[parts.length - 1] !== '..') parts.pop();
        else parts.push(part);
      });
      return (absolute ? '/' : '') + parts.join('/');
    }
    function assetFigures(key) {
      return Array.prototype.filter.call(
        document.querySelectorAll('#content img[data-loom-key]'),
        function (img) { return img.getAttribute('data-loom-key') === key; }
      );
    }
    function fetchFigure(key, path, attempt) {
      clearTimeout(assetRetry[key]);
      delete assetRetry[key];
      var url = 'loom-asset://figure?path=' + encodeURIComponent(path)
        + '&project=' + encodeURIComponent(assetProject)
        + (assetTask ? '&task=' + encodeURIComponent(assetTask) : '')
        + '&v=' + Date.now().toString(36) + '-' + (++assetSerial);
      assetWanted[key] = url;
      if (!assetShown[key]) {
        assetFigures(key).forEach(function (img) { img.src = url; });
      }
      var probe = new Image();
      probe.onload = function () {
        if (assetWanted[key] !== url && assetShown[key]) return;
        assetShown[key] = url;
        assetFigures(key).forEach(function (img) {
          if (img.getAttribute('src') !== url) img.src = url;
          img.classList.remove('missing');
          img.alt = img.getAttribute('data-loom-alt') || '';
        });
      };
      probe.onerror = function () {
        if (assetWanted[key] !== url) return;
        var figures = assetFigures(key);
        if (!assetShown[key]) {
          figures.forEach(function (img) {
            img.classList.add('missing');
            img.alt = (img.getAttribute('data-loom-alt') || 'figure') + ' — could not be loaded from the server';
          });
        }
        if (figures.length && attempt < ASSET_RETRY_MS.length) {
          assetRetry[key] = setTimeout(function () {
            fetchFigure(key, path, attempt + 1);
          }, ASSET_RETRY_MS[attempt]);
        }
      };
      probe.src = url;
    }
    // `refresh` asks the server again for figures already on screen; a
    // figure never shown yet is always asked for.
    function linkAssets(refresh) {
      if (!assetProject) return;
      var wanted = Object.create(null);
      var imgs = document.querySelectorAll('#content img');
      for (var i = 0; i < imgs.length; i++) {
        var img = imgs[i];
        var raw = img.getAttribute('data-loom-src') || img.getAttribute('src') || '';
        if (!raw || /^(https?:|data:|blob:|loom-asset:)/i.test(raw)) continue;
        if (!img.hasAttribute('data-loom-src')) {
          img.setAttribute('data-loom-src', raw);
          img.setAttribute('data-loom-alt', img.alt || '');
        }
        var path = assetPath(raw);
        var key = JSON.stringify([assetProject, assetTask, path]);
        img.setAttribute('data-loom-key', key);
        if (assetShown[key]) {
          if (img.getAttribute('src') !== assetShown[key]) img.src = assetShown[key];
          if (refresh) wanted[key] = path;
        } else {
          // Not the marked output's relative URL, which the page would
          // try to load against about:blank and paint as broken.
          img.removeAttribute('src');
          wanted[key] = path;
        }
      }
      Object.keys(wanted).forEach(function (key) { fetchFigure(key, wanted[key], 0); });
    }

    // Diagrams. A ```mermaid block is drawn instead of shown as code. The
    // renderer is megabytes, so the page fetches it through the asset
    // scheme the first time a document has a diagram rather than carrying
    // it the way it carries marked. Drawings are kept by theme and source:
    // a re-render puts an unchanged diagram straight back, where drawing
    // it again would flash the placeholder and shift everything below.
    var diagramRenderer = 'idle', diagramWaiting = [];
    var diagramDrawn = Object.create(null);
    var diagramChain = Promise.resolve(), diagramConfigured = '', diagramSerial = 0;
    var darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    function diagramTheme() { return darkScheme.matches ? 'dark' : 'neutral'; }
    function withDiagramRenderer(ready, failed) {
      if (diagramRenderer === 'ready') return ready();
      if (diagramRenderer === 'failed') return failed();
      diagramWaiting.push([ready, failed]);
      if (diagramRenderer === 'loading') return;
      diagramRenderer = 'loading';
      var script = document.createElement('script');
      var settle = function () {
        diagramRenderer = window.mermaid ? 'ready' : 'failed';
        var waiting = diagramWaiting;
        diagramWaiting = [];
        waiting.forEach(function (pair) { pair[diagramRenderer === 'ready' ? 0 : 1](); });
      };
      script.onload = settle;
      script.onerror = settle;
      script.src = 'loom-asset://bundle/mermaid.min.js';
      document.head.appendChild(script);
    }
    function showDiagram(box, svg) {
      box.classList.remove('drawing');
      box.innerHTML = svg;
      var drawing = box.querySelector('svg');
      var view = drawing && drawing.viewBox && drawing.viewBox.baseVal;
      if (view && view.width) {
        drawing.setAttribute('width', view.width);
        drawing.setAttribute('height', view.height);
        drawing.style.maxWidth = 'none';
      }
    }
    // The code comes back, with the reason it is not a drawing.
    function showDiagramSource(box, reason) {
      box.replaceWith(box.loomSource);
      if (!reason) return;
      var note = document.createElement('div');
      note.className = 'diagram-error';
      note.textContent = 'Diagram not drawn: ' + reason;
      box.loomSource.after(note);
    }
    function drawDiagram(box, theme) {
      var key = theme + '\n' + box.loomText;
      if (diagramDrawn[key]) return showDiagram(box, diagramDrawn[key]);
      box.classList.add('drawing');
      box.textContent = 'Drawing diagram…';
      withDiagramRenderer(function () {
        var id = '';
        // One at a time, and a failure ends only its own diagram.
        diagramChain = diagramChain.then(function () {
          if (!box.isConnected) return;
          if (diagramDrawn[key]) return showDiagram(box, diagramDrawn[key]);
          if (diagramConfigured !== theme) {
            window.mermaid.initialize({
              startOnLoad: false,
              theme: theme,
              securityLevel: 'strict',
              suppressErrorRendering: true,
              // Plans break their own labels with <br/>; the default 200px
              // wrap broke them again into tall, one-word-wide boxes.
              flowchart: { wrappingWidth: 420 },
              fontFamily: '-apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif'
            });
            diagramConfigured = theme;
          }
          id = 'loom-diagram-' + (++diagramSerial);
          return window.mermaid.render(id, box.loomText).then(function (out) {
            diagramDrawn[key] = out.svg;
            if (box.isConnected) showDiagram(box, out.svg);
          });
        }).catch(function (error) {
          var stray = id && document.getElementById('d' + id);
          if (stray) stray.remove();
          if (box.isConnected) {
            showDiagramSource(box, String((error && error.message) || error).split('\n')[0]);
          }
        });
      }, function () {
        if (box.isConnected) showDiagramSource(box, 'the diagram renderer did not load');
      });
    }
    function drawDiagrams() {
      var theme = diagramTheme();
      var codes = document.querySelectorAll('#content pre > code.language-mermaid');
      Array.prototype.forEach.call(codes, function (code) {
        var box = document.createElement('div');
        box.className = 'loom-diagram';
        box.loomSource = code.parentElement;
        box.loomText = code.textContent;
        code.parentElement.replaceWith(box);
        drawDiagram(box, theme);
      });
    }
    darkScheme.addEventListener('change', function () {
      var theme = diagramTheme();
      document.querySelectorAll('#content .loom-diagram').forEach(function (box) {
        drawDiagram(box, theme);
      });
    });

    // Find. `WKWebView.find` would highlight but gives no count and no
    // field to type into, so the whole thing lives in the page: wrap
    // matches in <mark>, step through them, and put the document back
    // exactly as it was on the way out.
    var findHits = [], findAt = -1, findActiveQuery = '';
    function findClear() {
      var root = document.getElementById('content');
      root.querySelectorAll('mark.loom-hit').forEach(function (mark) {
        mark.replaceWith(document.createTextNode(mark.textContent));
      });
      root.normalize();
      findHits = []; findAt = -1; findActiveQuery = '';
    }
    // `quiet` re-highlights after the document was rewritten under an open
    // search, without pulling the reader back to the current match.
    function findRun(query, quiet) {
      var root = document.getElementById('content');
      if (!root) return;
      findClear();
      findActiveQuery = String(query || '');
      var needle = findActiveQuery.toLowerCase();
      if (!needle) { findPaint(); return; }
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      var targets = [], node;
      while ((node = walker.nextNode())) {
        // A <mark> dropped into a drawing's text breaks the drawing.
        if (node.parentElement.closest('button, script, style, .loom-diagram')) continue;
        if (node.nodeValue.toLowerCase().indexOf(needle) !== -1) { targets.push(node); }
      }
      targets.forEach(function (text) {
        var parts = text.nodeValue.split(new RegExp('(' + needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'));
        var frag = document.createDocumentFragment();
        parts.forEach(function (part) {
          if (part.toLowerCase() === needle) {
            var m = document.createElement('mark');
            m.className = 'loom-hit';
            m.textContent = part;
            frag.appendChild(m);
          } else if (part) {
            frag.appendChild(document.createTextNode(part));
          }
        });
        text.parentNode.replaceChild(frag, text);
      });
      findHits = Array.prototype.slice.call(root.querySelectorAll('mark.loom-hit'));
      if (findHits.length) { findAt = 0; }
      findPaint(!quiet);
    }
    function findPaint(scroll) {
      findHits.forEach(function (hit, i) {
        hit.classList.toggle('current', i === findAt);
      });
      var count = document.getElementById('findCount');
      if (count) {
        count.textContent = findHits.length ? (findAt + 1) + '/' + findHits.length : '0';
      }
      // Sized to its content, this page cannot scroll itself: the view
      // around it does, and only the host can move that. So the match is
      // reported rather than scrolled to, and the host brings it into view.
      if (scroll && findAt >= 0 && findHits[findAt]) {
        revealSection(findHits[findAt]);
        if (!autosize) findHits[findAt].scrollIntoView({ block: 'center' });
      }
      postFind(!!scroll);
    }
    function postFind(reveal) {
      var hit = findAt >= 0 ? findHits[findAt] : null;
      var rect = hit ? hit.getBoundingClientRect() : null;
      try {
        window.webkit.messageHandlers.preview.postMessage({
          type: 'find',
          current: findHits.length ? findAt + 1 : 0,
          total: findHits.length,
          reveal: !!reveal && !!hit,
          top: rect ? rect.top + window.scrollY : 0,
          height: rect ? rect.height : 0
        });
      } catch (e) {}
    }
    // The host's own find bar drives these: a query to highlight, and
    // steps through the highlights.
    window.__loomFindQuery = function (query) { findRun(query); };
    window.__loomFindStep = function (delta) {
      if (!findHits.length) return;
      findAt = (findAt + delta + findHits.length) % findHits.length;
      findPaint(true);
    };
    window.__loomFindShow = function () {
      var bar = document.getElementById('find');
      var input = document.getElementById('findInput');
      if (!bar || !input) return;
      bar.classList.add('on');
      input.focus();
      input.select();
      if (input.value) { findRun(input.value); }
    };
    window.__loomFindHide = function () {
      var bar = document.getElementById('find');
      if (bar) { bar.classList.remove('on'); }
      findClear();
      postFind();
    };
    document.addEventListener('DOMContentLoaded', function () {
      var input = document.getElementById('findInput');
      input.addEventListener('input', function () { findRun(input.value); });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          window.__loomFindStep(e.shiftKey ? -1 : 1);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          window.__loomFindHide();
        }
      });
      document.getElementById('findNext').onclick = function () { window.__loomFindStep(1); };
      document.getElementById('findPrev').onclick = function () { window.__loomFindStep(-1); };
      document.getElementById('findDone').onclick = function () { window.__loomFindHide(); };
    });
    window.__loomRender = function(md, resetScroll, documentID, savedFolds) {
      var root = document.getElementById('content');
      // The query survives a document update, but its old DOM matches do not.
      findHits = []; findAt = -1;
      var rerun = findActiveQuery;
      if (foldDocument !== documentID) {
        foldDocument = documentID || '';
        collapsedKeys = new Set(savedFolds || []);
      }
      if (!md || !String(md).trim()) {
        root.innerHTML = '<div id="empty">Nothing to preview</div>';
        sections = [];
        document.getElementById('reading-tools').hidden = true;
        reportHeight();
        postFind();
        return;
      }
      var keepY = resetScroll ? 0 : window.scrollY;
      try {
        // marked passes a document's own HTML through untouched, and these
        // documents are written by agents or come with cloned repositories:
        // an `onerror` in one would run here. Without the sanitizer the
        // source is shown escaped rather than rendered unchecked.
        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
          if (marked.setOptions) {
            marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
          }
          var html = (marked.parse ? marked.parse(md) : marked(md));
          root.innerHTML = DOMPurify.sanitize(html);
        } else {
          root.innerHTML = '<pre>' + escapeHtml(md) + '</pre>';
        }
      } catch (e) {
        root.innerHTML = '<pre>' + escapeHtml(md) + '</pre>';
      }
      buildSections();
      linkAssets(true);
      drawDiagrams();
      window.scrollTo(0, keepY);
      reportHeight();
      if (rerun) { findRun(rerun, true); }
    };
  </script>
</body>
</html>
