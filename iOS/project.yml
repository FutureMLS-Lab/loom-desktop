# Loom for iPhone, iPad and Apple Watch. Generate the Xcode project with:
#
#   cd iOS && xcodegen generate
#
# The networking, models, chat session and markdown layout are the desktop
# app's own files, compiled into this target too, so both clients talk to
# Loom the same way. Keep them free of AppKit — and the networking, models
# and server list free of UIKit as well, since the watch compiles them too.
#
# The watch app ships inside the iPhone app and gets its servers from it over
# WatchConnectivity. Its complication reads what the watch app last saw, and
# what it can fetch itself, through the shared app group.
name: Loom
options:
  bundleIdPrefix: engineering.loom
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    # One version for every bundle: App Store Connect refuses a watch app or
    # extension whose versions differ from the iPhone app carrying it.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: 7B28C45G8P
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
targets:
  Loom:
    type: application
    platform: iOS
    sources:
      - path: Loom
      - path: ../Sources/LoomDesktop/LoomAPI.swift
        group: Shared
      - path: ../Sources/LoomDesktop/Models.swift
        group: Shared
      - path: ../Sources/LoomDesktop/LoomServers.swift
        group: Shared
      - path: ../Sources/LoomDesktop/ChatSession.swift
        group: Shared
      - path: ../Sources/LoomDesktop/SessionCache.swift
        group: Shared
      - path: ../Sources/LoomDesktop/ComposeDrafts.swift
        group: Shared
      - path: ../Sources/LoomDesktop/LoomResource.swift
        group: Shared
      - path: ../Sources/LoomDesktop/MarkdownBlocks.swift
        group: Shared
      - path: ../Resources/markdown-preview.html
        group: Shared
        buildPhase: resources
      - path: ../Resources/marked.min.js
        group: Shared
        buildPhase: resources
      - path: ../Resources/purify.min.js
        group: Shared
        buildPhase: resources
      - path: ../Resources/mermaid.min.js
        group: Shared
        buildPhase: resources
      - path: ../Resources/katex
        type: folder
        group: Shared
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - target: LoomWatch
    info:
      path: Loom/Info.plist
      properties:
        CFBundleDisplayName: Loom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Loom connects to the Loom gateway running on your development machine.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Loom
        PRODUCT_BUNDLE_IDENTIFIER: engineering.loom.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        ENABLE_PREVIEWS: true

  LoomWatch:
    type: application
    platform: watchOS
    sources:
      - path: LoomWatch
      - path: Loom/Common/Cancellation.swift
      - path: ../Sources/LoomDesktop/LoomAPI.swift
        group: Shared
      - path: ../Sources/LoomDesktop/Models.swift
        group: Shared
      - path: ../Sources/LoomDesktop/LoomServers.swift
        group: Shared
    dependencies:
      - target: LoomWatchWidgets
    info:
      path: LoomWatch/Info.plist
      properties:
        CFBundleDisplayName: Loom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: engineering.loom.ios
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: LoomWatch/LoomWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.engineering.loom
    settings:
      base:
        PRODUCT_NAME: LoomWatch
        PRODUCT_BUNDLE_IDENTIFIER: engineering.loom.ios.watchkitapp
        # Installed inside the iPhone app, never on its own: without this an
        # archive carries it twice and the export refuses it.
        SKIP_INSTALL: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true

  LoomWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: LoomWatchWidgets
      - path: LoomWatch/Glance/Glance.swift
      - path: ../Sources/LoomDesktop/Models.swift
        group: Shared
      - path: ../Sources/LoomDesktop/LoomServers.swift
        group: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LoomWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Loom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: LoomWatchWidgets/LoomWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.engineering.loom
    settings:
      base:
        PRODUCT_NAME: LoomWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: engineering.loom.ios.watchkitapp.widgets
        SKIP_INSTALL: true
